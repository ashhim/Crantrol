name: applicatoin
description: "CRANTROL - Industrial Control Panel for ESP32-S3 Ethernet Systems"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  firebase_database: ^12.4.2
  firebase_storage: ^13.4.2

  # State management
  provider: ^6.1.5
  get: ^4.6.6

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  animations: ^2.0.11

  # Networking
  http: ^1.2.0
  dio: ^5.6.0

  # Local storage
  shared_preferences: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.0.0
  connectivity_plus: ^7.1.1

  # Logging
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/.env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
